; Movella DOT local-only Lab Streaming Layer configuration.
; Set LSLAPICFG to the full path of this file for BOTH publisher and consumers.
[ports]
IPv6 = disable

[multicast]
ResolveScope = machine
MachineAddresses = {127.0.0.1}
AddressesOverride = {127.0.0.1}
ListenAddress = 127.0.0.1
Interfaces = {127.0.0.1}

[lab]
KnownPeers = {}
